name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install project
        run: python -m pip install -e .
      - name: Check package entry point
        run: python -m osu_coach --help
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check radar presentation rules
        run: node --test tests/test_web_ui.mjs
